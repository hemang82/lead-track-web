services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: leadtrack_backend
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - API_KEY=leadmanagement

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: leadtrack_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
